name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Show tool versions
        run: node --version && npm --version
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify dependency compatibility and security regressions
        run: npm run test:dependencies
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
      - name: Test
        env:
          COMMAND_HOTKEYS_PACK_TEST: '1'
        run: npm test
      - name: Smoke-test packed package
        run: node .github/scripts/package-smoke.mjs
