name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Согласованный ref или SHA исходников'
        required: true
        type: string
      version:
        description: 'Точная версия package.json, например 0.1.0'
        required: true
        type: string
      tag:
        description: 'Уже существующий тег, например v0.1.0'
        required: true
        type: string
      confirmation:
        description: 'После отдельного согласования запуска введите CREATE_DRAFT'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft:
    if: ${{ inputs.confirmation == 'CREATE_DRAFT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out approved ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version, existing tag and HEAD
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const version = process.env.EXPECTED_VERSION;
          const tag = process.env.RELEASE_TAG;
          assert.match(version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(manifest.name, 'opencode-command-hotkeys');
          assert.equal(manifest.version, version);
          assert.equal(tag, `v${version}`);
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(git('rev-parse', '--verify', `refs/tags/${tag}^{commit}`), git('rev-parse', 'HEAD'));
          NODE
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify dependency compatibility and security regressions
        run: npm run test:dependencies
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
      - name: Test
        env:
          COMMAND_HOTKEYS_PACK_TEST: '1'
        run: npm test
      - name: Smoke-test packed package
        run: node .github/scripts/package-smoke.mjs
      - name: Pack and checksum
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts
          cd release-artifacts
          sha256sum ./*.tgz > SHA256SUMS
      - name: Create GitHub draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/*.tgz release-artifacts/SHA256SUMS \
            --verify-tag --draft --title "$RELEASE_TAG" --notes-file CHANGELOG.md
